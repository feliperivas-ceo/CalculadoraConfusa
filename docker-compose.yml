# docker-compose.yml - Orquestación con Docker Compose (Bonus)
# Uso: docker-compose up

version: '3.8'

services:
  # Backend - Calculadora
  backend:
    build: .
    container_name: calculadora-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_APP: calculadora.py
    volumes:
      - ./data:/app/data
      - ./calculadora.log:/app/calculadora.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - calculadora-net

networks:
  calculadora-net:
    driver: bridge

volumes:
  data:
    driver: local
