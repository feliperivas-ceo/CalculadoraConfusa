services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: calc-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_APP: backend/calculadora.py
      FLASK_HOST: 0.0.0.0
      HISTORIAL_FILE: /app/data/historial.json
    volumes:
      - ./data:/app/data
      - ./calculadora.log:/app/calculadora.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - calculadora-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
    container_name: calc-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calculadora-net

networks:
  calculadora-net:
    driver: bridge

volumes:
  data:
    driver: local
