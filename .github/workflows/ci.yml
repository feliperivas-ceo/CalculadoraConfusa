name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up -d --build
      - name: Test backend endpoints
        run: bash scripts/test_endpoints.sh
      - name: Stop services
        if: always()
        run: docker compose down -v